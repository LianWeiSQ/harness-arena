<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Evo · 设置</title>
    <link rel="stylesheet" href="/harness.css?v=7" />
    <script defer src="/settings.js?v=5"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Evo 首页"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Evo</span></a>
      <nav aria-label="页面导航">
        <a href="/">首页</a><a href="/evo#evaluation">评测</a><a href="/evo#datasets">任务集</a><a href="/settings" aria-current="page">设置</a>
      </nav>
      <div class="header-actions">
        <span class="system-status">本地配置</span
        ><button id="theme-toggle" class="icon-btn" aria-label="切换明暗主题">
          ◐
        </button>
      </div>
    </header>
    <main class="page settings-page">
      <div class="page-heading">
        <div>
          <h1>模型连接</h1>
          <p class="page-description">管理评测使用的模型与 API 连接</p>
        </div>
        <a href="/evo">返回评测工作台 ↗</a>
      </div>
      <div class="settings-grid">
        <aside class="settings-sidebar">
        <section class="card" aria-labelledby="profiles-title">
          <header class="card-head">
            <h2 id="profiles-title">已保存连接</h2>
            <span id="profile-count" class="muted"></span>
          </header>
          <div id="profiles"></div>
        </section>
        <section class="card settings-runtime" aria-labelledby="runtime-title">
          <header class="card-head"><h2 id="runtime-title">运行环境</h2><button id="inspect-system">检查依赖</button></header>
          <div class="settings-runtime-body">
            <div id="system-checks" role="status">检查 Docker、Harbor 与模型配置。</div>
            <div id="system-defaults"><p>次数与预算在<a href="/evo">评测工作台</a>设置。</p></div>
          </div>
        </section>
        <details class="settings-help"><summary>连接说明</summary><p>支持兼容 OpenAI Responses API 的服务，模型 ID 需与服务商一致。</p><p>密钥保存在本机，页面不会回显。修改对新评测生效，正在执行的任务使用启动时的配置。</p></details>
        </aside>
        <section class="card settings-editor" aria-labelledby="form-title">
          <header class="card-head">
            <div class="settings-editor-title">
              <h2 id="form-title">添加模型连接</h2>
              <span class="api-label">Responses API</span>
            </div>
            <button id="new-profile" type="button">新建 +</button>
          </header>
          <form id="model-form" class="settings-form">
            <input type="hidden" id="profile-id" />
            <div class="form-row">
              <label class="field"
                >连接名称<input
                  id="profile-name"
                  placeholder="例如，开发环境 GPT"
                  maxlength="120"
                  required /></label
              ><label class="field"
                >模型 ID<input
                  id="profile-model"
                  placeholder="例如，gpt-5.6-sol"
                  maxlength="256"
                  required
                  spellcheck="false"
              /></label>
            </div>
            <label class="field"
              >API 地址<input
                id="profile-url"
                type="url"
                placeholder="https://api.example.com/v1"
                required
                spellcheck="false"
            /></label>
            <p class="hint">填写 API 基础地址，通常以 /v1 结尾。</p>
            <label class="field"
              >API Key<input
                id="profile-key"
                type="password"
                autocomplete="new-password"
                placeholder="输入此连接的 API Key"
                required
            /></label>
            <p id="key-hint" class="hint">
              密钥保存在本机，页面不会回显。
            </p>
            <label class="checkbox-field"
              ><input
                id="profile-default"
                type="checkbox"
              />设为默认模型</label
            >
            <div class="form-actions">
              <button type="submit" id="save-model" class="primary">
                保存连接</button
              ><span class="muted">保存后立即可用</span>
            </div>
            <p id="save-status" class="save-status" role="status"></p>
          </form>
        </section>
      </div>
      <footer>
        <span>Evo · 本地设置</span><a href="/harness">历史竞技记录 ↗</a>
      </footer>
    </main>
  </body>
</html>
