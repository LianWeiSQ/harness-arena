[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-arena"
version = "0.1.0"
description = "Verifiable competition and evolution for tool-using agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
harbor = ["harbor==0.22.0"]

[project.scripts]
evo-arena = "evo_arena.cli:main"

[tool.setuptools.packages.find]
include = ["evo_arena*"]

[tool.setuptools.package-data]
evo_arena = ["static/*", "fixtures/*", "fixtures/harness/*"]
